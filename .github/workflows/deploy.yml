name: PS5 开源项目与插件源定时自动更新

on:
  schedule:
    - cron: '0 * * * *' # 每小时整点自动执行
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击触发

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. 执行更新与数据同步脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/update-db.js

      - name: 4. 提交并同步最新数据
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add json/repos-database.json json/payloads.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 自动同步最新 PS5 仓库与 payloads 数据 [skip ci]" && git push)
